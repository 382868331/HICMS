name: Deploy to myserver

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build API (Maven)
        run: |
          cd hicms-api
          mvn clean package -DskipTests
          cp hicms-admin/target/hicms-admin.jar /opt/hicms/

      - name: Build Web (Vite)
        run: |
          cd hicms-web
          sudo rm -rf node_modules 2>/dev/null || true
          npm ci
          npm run build
          sudo rm -rf /var/www/hicms/*
          sudo cp -r dist/* /var/www/hicms/

      - name: Restart API Service
        run: sudo systemctl restart hicms

      - name: Done
        run: echo "Deploy completed at $(date)"
