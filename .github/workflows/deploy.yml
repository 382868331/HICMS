name: Deploy to myserver

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Cleanup previous build artifacts
        run: |
          sudo rm -rf /opt/actions-runner/_work/HICMS/HICMS/hicms-api/*/target 2>/dev/null || true
          rm -rf /opt/actions-runner/_work/HICMS/HICMS/hicms-web/node_modules 2>/dev/null || true
          rm -rf /opt/actions-runner/_work/HICMS/HICMS/hicms-web/.vite 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build API (Maven)
        run: mvn -f /opt/actions-runner/_work/HICMS/HICMS/hicms-api/pom.xml clean package -DskipTests

      - name: Deploy API JAR
        run: cp /opt/actions-runner/_work/HICMS/HICMS/hicms-api/hicms-admin/target/hicms-admin.jar /opt/hicms/

      - name: Build Web (Vite)
        run: |
          cd /opt/actions-runner/_work/HICMS/HICMS/hicms-web
          npm ci
          npm run build

      - name: Deploy Web
        run: |
          ls -la /opt/actions-runner/_work/HICMS/HICMS/hicms-web/dist/index.html || { echo "ERROR: dist not found"; exit 1; }
          rm -rf /var/www/hicms/*
          cp -r /opt/actions-runner/_work/HICMS/HICMS/hicms-web/dist/* /var/www/hicms/

      - name: Restart API Service
        run: sudo systemctl restart hicms

      - name: Done
        run: echo "Deploy completed at $(date)"

      - name: Fix workspace permissions
        run: sudo chown -R actions-runner:actions-runner /opt/actions-runner/_work/HICMS 2>/dev/null || true
        if: always()
