name: Deploy to myserver

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API (Maven)
        run: |
          cd hicms-api
          mvn clean package -DskipTests -q
          cp hicms-admin/target/hicms-admin.jar /opt/hicms/

      - name: Build Web (Vite)
        run: |
          cd hicms-web
          npm ci
          npm run build
          rm -rf /var/www/hicms/*
          cp -r dist/* /var/www/hicms/

      - name: Restart API Service
        run: sudo systemctl restart hicms

      - name: Done
        run: echo "Deploy completed at $(date)"
